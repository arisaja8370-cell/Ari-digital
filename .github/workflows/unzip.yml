name: Extract Ari Digital

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Buka ZIP
        run: |
          unzip -o ari-digital-template-01-slot-foto-v6.zip -d extracted
          cp -r extracted/* .
          rm -rf extracted
          rm ari-digital-template-01-slot-foto-v6.zip

      - name: Simpan hasil
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Extract Ari Digital project" || echo "Tidak ada perubahan"
          git push
